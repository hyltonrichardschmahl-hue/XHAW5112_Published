<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Next Level Gaming | Cart</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="packages.html">Packages</a>
            <a href="index.html" class="logo-link"><img src="Image/nlg_logo.png" class="logo-inline" alt="Next Level Gaming logo"></a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main class="cart-main">
        <a class="detail-back" href="packages.html">&larr; Continue browsing</a>
        <h1>Your Cart</h1>
        <div class="cart-table-wrap">
            <table class="cart-table">
                <thead>
                    <tr><th>Package</th><th>Quantity</th><th>Price</th><th>Action</th></tr>
                </thead>
                <tbody id="cart-items"></tbody>
                <tfoot>
                    <tr class="cart-summary"><td colspan="2">Subtotal</td><td id="cart-subtotal" colspan="2">R0</td></tr>
                    <tr class="cart-summary discount-row"><td colspan="2" id="cart-discount-label">Discount (0%)</td><td id="cart-discount" colspan="2">-R0</td></tr>
                    <tr class="cart-summary cart-final-total"><td colspan="2">Total after discount</td><td id="cart-total" colspan="2">R0</td></tr>
                </tfoot>
            </table>
        </div>
        <div class="cart-actions">
            <button class="btn-pill" type="button">Complete Payment</button>
            <a class="btn-pill cart-secondary" href="packages.html">Continue Ordering</a>
        </div>
    </main>
    <script src="package-cart.js"></script>
    <script>
        var cartApi = window.nextLevelGamingCart;
        var items = document.getElementById("cart-items");
        var total = document.getElementById("cart-total");
        var subtotalElement = document.getElementById("cart-subtotal");
        var discountElement = document.getElementById("cart-discount");
        var discountLabel = document.getElementById("cart-discount-label");

        function renderCart() {
            var cart = cartApi.getCart();
            items.innerHTML = "";

            if (cart.length === 0) {
                items.innerHTML = '<tr><td colspan="4" class="cart-empty">Your cart is empty.</td></tr>';
                subtotalElement.textContent = "R0";
                discountElement.textContent = "-R0";
                discountLabel.textContent = "Discount (0%)";
                total.textContent = "R0";
                return;
            }

            var subtotal = 0;
            var bookingCount = 0;
            cart.forEach(function (item, index) {
                var lineTotal = item.price * item.quantity;
                subtotal += lineTotal;
                bookingCount += item.quantity;
                var row = document.createElement("tr");
                row.innerHTML =
                    "<td>" + item.name + "</td>" +
                    '<td><div class="cart-quantity">' +
                    '<button class="quantity-button" type="button" data-action="decrease" data-index="' + index + '" aria-label="Decrease ' + item.name + ' quantity">-</button>' +
                    '<span class="quantity-value" aria-live="polite">' + item.quantity + '</span>' +
                    '<button class="quantity-button" type="button" data-action="increase" data-index="' + index + '" aria-label="Increase ' + item.name + ' quantity">+</button>' +
                    "</div></td>" +
                    "<td>R" + lineTotal.toLocaleString() + "</td>" +
                    '<td><button class="cart-remove" type="button" data-action="remove" data-index="' + index + '">Remove</button></td>';
                items.appendChild(row);
            });

            var discountRate = 0;
            if (bookingCount <= 1) {
                discountRate = 0;
            } else if (bookingCount === 2) {
                discountRate = 0.05;
            } else if (bookingCount === 3) {
                discountRate = 0.10;
            } else if (bookingCount >= 4) {
                discountRate = 0.15;
            }

            var discountPercent = discountRate * 100;
            var discount = Math.round(subtotal * discountRate);
            var finalTotal = subtotal - discount;
            subtotalElement.textContent = "R" + subtotal.toLocaleString();
            discountLabel.textContent = "Discount (" + discountPercent + "%)";
            discountElement.textContent = "-R" + discount.toLocaleString();
            total.textContent = "R" + finalTotal.toLocaleString();
        }

        items.addEventListener("click", function (event) {
            var button = event.target.closest("button[data-action]");
            if (!button) return;

            var cart = cartApi.getCart();
            var index = Number(button.dataset.index);
            var action = button.dataset.action;

            if (action === "remove") {
                cart.splice(index, 1);
            } else if (action === "increase") {
                cart[index].quantity += 1;
            } else if (action === "decrease") {
                cart[index].quantity -= 1;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
            }

            cartApi.saveCart(cart);
            renderCart();
        });

        renderCart();
    </script>
    <footer>
        <p>&copy;2026 Next Level Gaming Esports Area | Johannesburg</p>
    </footer>
</body>
</html>
